<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAMES Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(120deg, #ff758c, #ff7eb3);
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Floating hearts background */
    .heart-float {
        position: absolute;
        color: rgba(255,255,255,0.5);
        font-size: 20px;
        animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
        100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    .card {
        width: 90%;
        max-width: 600px;
        padding: 25px;
        background: rgba(255,255,255,0.85);
        border-radius: 20px;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        text-align: center;
        animation: fadeIn 1.2s ease;
        position: relative;
        z-index: 2;
    }

    @keyframes fadeIn {
        from {
            opacity: 0; transform: translateY(30px);
        }
        to {
            opacity: 1; transform: translateY(0);
        }
    }

    h1 {
        font-size: 32px;
        color: #d62839;
        margin-bottom: 18px;
    }

    input {
        width: 80%;
        padding: 12px;
        font-size: 18px;
        border-radius: 15px;
        border: 2px solid #ff4f6d;
        margin: 12px 0;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        background: #ffe3e3;
        border-color: #d62839;
    }

    button {
        margin-top: 10px;
        padding: 14px 35px;
        border: none;
        border-radius: 18px;
        background: #d62839;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #b71c2a;
        transform: scale(1.05);
    }

    #heart {
        font-size: 55px;
        animation: pulse 1.2s infinite alternate;
        margin-top: 15px;
        display: none;
    }

    @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.25); }
    }

    #resultBox {
        margin-top: 20px;
        font-size: 28px;
        font-weight: 600;
        color: #d62839;
        min-height: 40px;
    }
</style>
</head>

<body>

<!-- Floating hearts -->
<script>
    for(let i=0; i<25; i++){
        let heart = document.createElement("div");
        heart.classList.add("heart-float");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 3 + Math.random() * 5 + "s";
        heart.style.fontSize = 15 + Math.random() * 25 + "px";
        document.body.appendChild(heart);
    }
</script>

<div class="card">
    <h1>FLAMES Calculator 💘</h1>

    <input type="text" id="fname" placeholder="Enter first name">
    <input type="text" id="lname" placeholder="Enter second name">

    <button onclick="myfunction()">Check Match</button>

    <div id="heart">❤️</div>
    <div id="resultBox"></div>
</div>

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

function burstConfetti() {
    confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
    });
}

function myfunction() {
    document.getElementById("heart").style.display = "none";
    document.getElementById("resultBox").innerHTML = "";

    let x = document.getElementById("fname").value.trim();
    let y = document.getElementById("lname").value.trim();

    if(x === "" || y === ""){
        document.getElementById("resultBox").innerHTML = "❗ Please enter both names!";
        return;
    }

    stringConcat(x, y);
}

function stringConcat(x, y) {
    let name1 = x.toLowerCase().replace(" ", "");
    let name2 = y.toLowerCase().replace(" ", "");

    let chars1 = name1.split("");
    let chars2 = name2.split("");

    for (let i = 0; i < chars1.length; i++) {
        for (let j = 0; j < chars2.length; j++) {
            if (chars1[i] === chars2[j]) {
                chars1.splice(i, 1);
                chars2.splice(j, 1);
                i = -1;
                j = -1;
                break;
            }
        }
    }

    let total = chars1.concat(chars2).length;
    flames(total);
}

function flames(count) {
    let arr = ['f','l','a','m','e','s'];
    let index = 0;

    while (arr.length > 1) {
        index = (index + count - 1) % arr.length;
        arr.splice(index, 1);
    }

    finalcheck(arr[0]);
}

function finalcheck(letter) {

    const messages = {
        f: "Friends 🤝",
        l: "Love ❤️",
        a: "Affection 😊",
        m: "Marriage 💍",
        e: "Enemies 😡",
        s: "Siblings 👨‍👩‍👧"
    };

    if(letter === "l" || letter === "m"){
        document.getElementById("heart").style.display = "block";
        burstConfetti();
    }

    document.getElementById("resultBox").innerHTML = messages[letter];
}
</script>

</body>
</html>
